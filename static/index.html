<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>JG-Loader · Descarga audio y video de YouTube</title>
<meta name="description" content="JG-Loader: descarga videos de YouTube en MP3, MP4 y más. Rápido, gratis y desde el celular.">
<meta property="og:title" content="JG-Loader">
<meta property="og:description" content="Descarga videos de YouTube en MP3, MP4 y más.">
<meta property="og:image" content="/logo.png">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050816;--bg2:#0a0f2c;
    --cyan:#22e6ff;--blue:#3b82f6;--violet:#a855f7;--pink:#e879f9;
    --txt:#e6f6ff;--mut:#8aa0c7;--line:rgba(34,230,255,.18);
    --glass:rgba(12,20,52,.55);--ok:#34f5a5;--err:#ff5d8f;
    --grad:linear-gradient(120deg,var(--cyan),var(--blue) 45%,var(--violet) 80%,var(--pink));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(1200px 700px at 50% -10%,#16205a 0%,var(--bg2) 40%,var(--bg) 75%)}
  body{
    font-family:Inter,system-ui,sans-serif;color:var(--txt);
    overflow-x:hidden;min-height:100dvh;display:flex;flex-direction:column;
  }
  #fx{position:fixed;inset:0;z-index:0;pointer-events:none}
  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:44px 44px;opacity:.25;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 70%);
    animation:gridmove 12s linear infinite}
  @keyframes gridmove{to{background-position:0 44px,44px 0}}
  .wrap{position:relative;z-index:1;width:100%;max-width:720px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 24px;flex:1}

  /* ---------- Intro / boot ---------- */
  #boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .6s,visibility .6s}
  #boot.hide{opacity:0;visibility:hidden}
  #boot .in{text-align:center;width:min(320px,80vw)}
  #boot img{width:min(220px,58vw);filter:drop-shadow(0 0 24px rgba(34,230,255,.6));animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
  #boot .scan{height:3px;margin:22px auto 10px;background:rgba(34,230,255,.12);border-radius:3px;overflow:hidden}
  #boot .scan i{display:block;height:100%;width:0;background:var(--grad);box-shadow:0 0 12px var(--cyan);animation:load 1.5s .2s ease-in-out forwards}
  #boot code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cyan);letter-spacing:.06em;min-height:1.4em;display:block}
  @keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes load{to{width:100%}}

  /* ---------- Header ---------- */
  header{text-align:center;padding:6px 0 10px}
  .logo{width:min(170px,42vw);display:block;margin:0 auto;filter:drop-shadow(0 0 18px rgba(34,230,255,.45)) drop-shadow(0 0 32px rgba(168,85,247,.35));animation:float 5s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-6px)}}
  h1{font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(28px,8vw,44px);margin:8px 0 2px;letter-spacing:.04em;
     background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .sub{color:var(--mut);margin:0;font-size:15px}
  .sub b{color:var(--cyan);font-weight:500;font-family:'JetBrains Mono',monospace}
  .caret{display:inline-block;width:8px;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- Card ---------- */
  .card{position:relative;margin-top:18px;padding:18px;border-radius:20px;background:var(--glass);
        backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);
        box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
  .card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:var(--grad);background-size:300% 300%;
        -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
        opacity:.55;animation:border 6s linear infinite;pointer-events:none}
  @keyframes border{50%{background-position:100% 100%}}
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
  body.ready .reveal{opacity:1;transform:none}
  body.ready .reveal.d2{transition-delay:.12s}body.ready .reveal.d3{transition-delay:.24s}

  .field{display:flex;align-items:center;gap:8px;background:rgba(3,8,26,.75);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;transition:border-color .2s,box-shadow .2s}
  .field:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,230,255,.15),0 0 24px rgba(34,230,255,.2)}
  .field svg{flex:none;opacity:.7}
  #url{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font:500 16px Inter,sans-serif;padding:10px 0}
  #url::placeholder{color:#5d6f96}
  .ghost{flex:none;border:1px solid var(--line);background:rgba(34,230,255,.08);color:var(--cyan);border-radius:10px;padding:10px 12px;font:600 13px Inter;cursor:pointer}

  .tabs{display:flex;gap:6px;margin:16px 0 10px;background:rgba(3,8,26,.6);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tab{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font:600 14px Inter;cursor:pointer;transition:.2s}
  .tab.on{background:linear-gradient(120deg,rgba(34,230,255,.2),rgba(168,85,247,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(34,230,255,.35)}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
  .chip{border:1px solid var(--line);background:rgba(3,8,26,.55);color:var(--txt);border-radius:12px;padding:11px 6px;cursor:pointer;font:600 14px Inter;transition:.18s;text-align:center}
  .chip small{display:block;font:400 11px 'JetBrains Mono',monospace;color:var(--mut);margin-top:2px}
  .chip.on{border-color:var(--cyan);background:rgba(34,230,255,.12);box-shadow:0 0 16px rgba(34,230,255,.3)}
  .chip:active{transform:scale(.96)}

  .go{position:relative;width:100%;margin-top:16px;border:0;border-radius:14px;padding:16px;cursor:pointer;color:#03101e;
      font:800 16px Orbitron,sans-serif;letter-spacing:.08em;background:var(--grad);background-size:200% auto;
      box-shadow:0 8px 30px rgba(34,230,255,.35),0 0 0 1px rgba(255,255,255,.15) inset;overflow:hidden;transition:transform .15s,background-position .6s}
  .go:hover{background-position:right center}.go:active{transform:scale(.98)}
  .go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sweep 3.2s infinite}
  @keyframes sweep{60%,100%{left:130%}}
  .go:disabled{filter:grayscale(.6) brightness(.7);cursor:wait}

  .preview{display:none;gap:12px;margin-top:14px;align-items:center;padding:10px;border-radius:14px;background:rgba(3,8,26,.55);border:1px solid var(--line);animation:fadein .4s}
  .preview.show{display:flex}
  .preview img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none;background:#0b1233}
  .preview .t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .preview .m{color:var(--mut);font:12px 'JetBrains Mono',monospace;margin-top:4px}
  .preview.loading .t,.preview.loading .m{background:linear-gradient(90deg,#14204d,#1e2e6b,#14204d);background-size:200%;animation:shim 1s infinite;color:transparent;border-radius:6px}
  @keyframes shim{to{background-position:-200% 0}}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}}

  /* ---------- Jobs ---------- */
  #jobs:empty{display:none}
  .job{animation:fadein .4s}
  .job+.job{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
  .job .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:14px}
  .job .h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tag{flex:none;font:500 11px 'JetBrains Mono',monospace;color:var(--cyan);border:1px solid var(--line);padding:3px 7px;border-radius:6px}
  .bar{position:relative;height:8px;margin-top:12px;border-radius:8px;background:rgba(3,8,26,.8);overflow:hidden;border:1px solid var(--line)}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--grad);box-shadow:0 0 14px var(--cyan);transition:width .4s}
  .bar.indet i{width:35%!important;animation:indet 1.1s ease-in-out infinite}
  @keyframes indet{from{left:-35%}to{left:100%}}
  .s{font:12px 'JetBrains Mono',monospace;color:var(--mut);margin-top:8px}
  .s.err{color:var(--err)}
  .acts{display:none;gap:8px;margin-top:12px;flex-wrap:wrap}
  .acts.show{display:flex}
  .btn{flex:1 1 140px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 14px;font:600 14px Inter;text-decoration:none;cursor:pointer;border:1px solid var(--line);transition:transform .15s}
  .btn:active{transform:scale(.97)}
  .btn.dl{background:linear-gradient(120deg,#16e3a0,var(--cyan));color:#03201a;border:0;box-shadow:0 6px 22px rgba(52,245,165,.3)}
  .btn.sh{background:rgba(168,85,247,.14);color:#e9d5ff;border-color:rgba(168,85,247,.45)}

  .feats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
  .feat{text-align:center;padding:14px 8px;border-radius:16px;background:rgba(12,20,52,.4);border:1px solid var(--line)}
  .feat .i{font-size:22px}.feat b{display:block;font-size:13px;margin-top:4px}.feat span{font-size:11px;color:var(--mut)}

  footer{position:relative;z-index:1;text-align:center;padding:22px 16px max(22px,env(safe-area-inset-bottom));color:var(--mut);font-size:13px}
  footer .dev{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(12,20,52,.55);color:var(--txt);text-decoration:none;transition:.2s}
  footer .dev:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(34,230,255,.3)}
  footer .dev strong{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  footer p{margin:10px 0 0;font-size:11px;opacity:.7}

  #toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,120px);z-index:60;
         background:rgba(10,16,44,.95);border:1px solid var(--cyan);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:14px;
         box-shadow:0 0 24px rgba(34,230,255,.35);transition:transform .35s cubic-bezier(.2,1.3,.4,1);max-width:90vw;text-align:center}
  #toast.show{transform:translate(-50%,0)}

  @media (max-width:520px){
    .card{padding:14px;border-radius:18px}
    .preview img{width:96px}
    .feats{gap:8px}.feat{padding:12px 4px}
    .chips{grid-template-columns:repeat(3,1fr)}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="boot"><div class="in">
  <img src="/logo.png" alt="JG">
  <div class="scan"><i></i></div>
  <code id="bootTxt"></code>
</div></div>

<canvas id="fx"></canvas>
<div class="grid"></div>

<div class="wrap">
  <header class="reveal">
    <img class="logo" src="/logo.png" alt="Logo JG-Loader">
    <h1>JG-LOADER</h1>
    <p class="sub">Descarga <b id="typed"></b><span class="caret"></span></p>
  </header>

  <section class="card reveal d2">
    <div class="field">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22e6ff" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1 1"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1-1"/></svg>
      <input id="url" type="url" inputmode="url" placeholder="Pega el enlace de YouTube…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="ghost" id="paste" type="button">Pegar</button>
    </div>

    <div class="preview" id="preview">
      <img id="thumb" alt="">
      <div style="min-width:0;flex:1"><div class="t" id="title">Cargando título del video</div><div class="m" id="meta">--:--</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" data-k="audio" type="button">🎧 Audio</button>
      <button class="tab" data-k="video" type="button">🎬 Video</button>
    </div>
    <div class="chips" id="chips"></div>

    <button class="go" id="go" type="button">⚡ DESCARGAR</button>
  </section>

  <section class="card reveal d3" id="jobsCard" style="display:none"><div id="jobs"></div></section>

  <div class="feats reveal d3">
    <div class="feat"><div class="i">⚡</div><b>Ultra rápido</b><span>Conversión al instante</span></div>
    <div class="feat"><div class="i">📱</div><b>Móvil</b><span>Hecho para tu celular</span></div>
    <div class="feat"><div class="i">🔗</div><b>Compartible</b><span>Envía el enlace</span></div>
  </div>
</div>

<footer>
  <a class="dev" href="https://jgg-ia.github.io/portafolio/" target="_blank" rel="noopener">
    <span>Desarrollado por</span> <strong>Julián García</strong>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg>
  </a>
  <p>Úsalo solo con contenido propio o con permiso del titular de los derechos.</p>
</footer>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const FORMATS = {
  audio:[['mp3','MP3','320 kbps'],['m4a','M4A','AAC'],['opus','OPUS','ligero'],['wav','WAV','sin pérdida'],['flac','FLAC','sin pérdida'],['aac','AAC','estándar']],
  video:[['360','360p','MP4'],['480','480p','MP4'],['720','720p','HD'],['1080','1080p','Full HD'],['1440','1440p','2K'],['2160','2160p','4K'],['best','MÁX','mejor']]
};
const LABEL = Object.fromEntries([...FORMATS.audio,...FORMATS.video].map(([v,l,s])=>[v,`${l}${/^\d|MÁX/.test(l)?' MP4':''}`]));
const STATUS = {queued:'EN COLA',starting:'INICIANDO',downloading:'DESCARGANDO',processing:'CONVIRTIENDO',done:'LISTO',error:'ERROR'};
let kind='audio', fmt='mp3', lastInfo=null;

/* ---------- Intro ---------- */
const bootLines=['> iniciando núcleo JG…','> conectando motores…','> sistema listo ✓'];
(async()=>{
  const el=$('bootTxt');
  for(const l of bootLines){ el.textContent=l; await sleep(520); }
  finishBoot();
})();
$('boot').onclick=finishBoot;
function finishBoot(){ if(document.body.classList.contains('ready'))return; $('boot').classList.add('hide'); document.body.classList.add('ready'); typeLoop(); }
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

/* ---------- Typing subtitle ---------- */
async function typeLoop(){
  const words=['música en MP3','videos en 4K','podcasts en M4A','audio en FLAC','lo que quieras'];
  const el=$('typed');
  for(let i=0;;i=(i+1)%words.length){
    for(const c of words[i]){ el.textContent+=c; await sleep(55); }
    await sleep(1500);
    while(el.textContent){ el.textContent=el.textContent.slice(0,-1); await sleep(25); }
  }
}

/* ---------- Particle network background ---------- */
(()=>{
  const c=$('fx'),x=c.getContext('2d'); let W,H,P=[],dpr=Math.min(devicePixelRatio||1,2);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';
    const n=Math.round(Math.min(70,innerWidth*innerHeight/14000));
    P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35*dpr,vy:(Math.random()-.5)*.35*dpr,r:(Math.random()*1.6+.6)*dpr,h:Math.random()<.5?190:280}));}
  size(); addEventListener('resize',size);
  const D=130*dpr;
  (function loop(){
    x.clearRect(0,0,W,H);
    for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
        if(d<D){x.strokeStyle=`hsla(${p.h},100%,65%,${(1-d/D)*.35})`;x.lineWidth=dpr*.7;x.beginPath();
          x.moveTo(p.x,p.y);x.lineTo(p.x,q.y);x.lineTo(q.x,q.y);x.stroke();}}  /* líneas en L = estilo circuito */
      x.fillStyle=`hsla(${p.h},100%,70%,.9)`;x.shadowColor=`hsl(${p.h},100%,60%)`;x.shadowBlur=8*dpr;
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.shadowBlur=0;}
    requestAnimationFrame(loop);
  })();
})();

/* ---------- Format chips ---------- */
function renderChips(){
  $('chips').innerHTML='';
  for(const [v,l,s] of FORMATS[kind]){
    const b=document.createElement('button'); b.type='button'; b.className='chip'+(v===fmt?' on':'');
    b.innerHTML=`${l}<small>${s}</small>`; b.onclick=()=>{fmt=v;renderChips();vib(8)}; $('chips').appendChild(b);
  }
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  kind=t.dataset.k; document.querySelectorAll('.tab').forEach(o=>o.classList.toggle('on',o===t));
  fmt = kind==='audio'?'mp3':'720'; renderChips(); vib(8);
});
function setFormat(f){ kind = FORMATS.audio.some(a=>a[0]===f)?'audio':'video'; fmt=f;
  document.querySelectorAll('.tab').forEach(o=>o.classList.toggle('on',o.dataset.k===kind)); renderChips(); }
renderChips();

/* ---------- URL + preview ---------- */
const fmtTime=s=>{if(!s)return'';s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${z}`:`${m}:${z}`};
const fmtSize=b=>b>1e9?(b/1e9).toFixed(2)+' GB':(b/1e6).toFixed(1)+' MB';
let infoTimer, infoSeq=0;
$('url').addEventListener('input',()=>{clearTimeout(infoTimer);infoTimer=setTimeout(loadInfo,450)});
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
$('paste').onclick=async()=>{
  try{ $('url').value=(await navigator.clipboard.readText()).trim(); loadInfo(); }
  catch{ $('url').focus(); toast('Mantén presionado el campo y elige "Pegar"'); }
};
async function loadInfo(){
  const url=$('url').value.trim(), seq=++infoSeq; lastInfo=null;
  if(!/^https?:\/\//i.test(url)){ $('preview').classList.remove('show'); return; }
  const pv=$('preview'); pv.classList.add('show','loading'); $('thumb').removeAttribute('src'); $('thumb').style.display='';
  try{
    const r=await fetch('/api/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
    const d=await r.json(); if(seq!==infoSeq)return;
    if(!r.ok) throw new Error(d.detail);
    lastInfo=d; const th=$('thumb'); th.style.display=d.thumbnail?'':'none'; if(d.thumbnail) th.src=d.thumbnail; $('title').textContent=d.title||url;
    $('meta').textContent=[d.uploader,fmtTime(d.duration)].filter(Boolean).join(' · ');
    pv.classList.remove('loading');
  }catch(e){ if(seq===infoSeq) pv.classList.remove('show','loading'); }
}

/* ---------- Download ---------- */
$('go').onclick=start;
async function start(){
  const url=$('url').value.trim();
  if(!url){ toast('Pega primero un enlace 🔗'); $('url').focus(); return; }
  $('go').disabled=true; vib(15);
  try{
    const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,format:fmt})});
    const d=await r.json(); if(!r.ok) throw new Error(d.detail||'Error');
    addJob({id:d.id,url,fmt,title:lastInfo?.title||url,auto:!shared});
    shared=false;
  }catch(e){ toast('⚠ '+e.message); }
  finally{ $('go').disabled=false; }
}
function shareLink(url,f){ return `${location.origin}/?url=${encodeURIComponent(url)}&f=${encodeURIComponent(f)}`; }
function addJob(j){
  $('jobsCard').style.display='block';
  const el=document.createElement('div'); el.className='job';
  el.innerHTML=`<div class="h"><b></b><span class="tag">${LABEL[j.fmt]}</span></div>
    <div class="bar indet"><i></i></div><div class="s">EN COLA…</div>
    <div class="acts"><a class="btn dl" download>⬇ Guardar archivo</a><button class="btn sh" type="button">🔗 Compartir</button></div>`;
  el.querySelector('b').textContent=j.title;
  el.querySelector('.sh').onclick=()=>share(shareLink(j.url,j.fmt), el.querySelector('b').textContent);
  $('jobs').prepend(el); el.scrollIntoView({behavior:'smooth',block:'nearest'});
  poll(j,el);
}
async function poll(j,el){
  try{
    const d=await (await fetch('/api/progress/'+j.id)).json();
    const bar=el.querySelector('.bar'), s=el.querySelector('.s');
    if(d.title) el.querySelector('b').textContent=d.title;
    bar.classList.toggle('indet', !d.progress && d.status!=='done' && d.status!=='error');
    bar.querySelector('i').style.width=(d.progress||0)+'%';
    if(d.status==='done'){
      s.textContent=`✓ LISTO · ${d.filename} · ${fmtSize(d.size)}`; s.style.color='var(--ok)';
      const a=el.querySelector('.dl'); a.href='/api/file/'+j.id; el.querySelector('.acts').classList.add('show');
      vib([20,40,20]); toast('✓ ¡Tu archivo está listo!');
      if(j.auto) a.click();
      return;
    }
    if(d.status==='error'){ s.className='s err'; s.textContent='✕ '+d.error; bar.classList.remove('indet'); return; }
    s.textContent=[STATUS[d.status]||d.status, d.progress?d.progress+'%':'', d.speed, d.eta&&'ETA '+d.eta].filter(Boolean).join(' · ');
  }catch(e){}
  setTimeout(()=>poll(j,el),1000);
}

/* ---------- Share ---------- */
async function share(link,title){
  if(navigator.share){ try{ await navigator.share({title:'JG-Loader',text:`Descarga "${title}" con JG-Loader`,url:link}); return; }catch(e){ if(e.name==='AbortError')return; } }
  try{ await navigator.clipboard.writeText(link); toast('🔗 Enlace copiado'); }
  catch{ prompt('Copia este enlace:',link); }
}

/* ---------- Utils ---------- */
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }
function vib(p){ try{navigator.vibrate&&navigator.vibrate(p)}catch{} }

/* ---------- Abrir un enlace compartido ---------- */
const qs=new URLSearchParams(location.search); let shared=false;
if(qs.get('url')){
  $('url').value=qs.get('url'); if(qs.get('f')) setFormat(qs.get('f'));
  shared=true; loadInfo();
  setTimeout(start, 1900);   // inicia la conversión al terminar la intro
  history.replaceState(null,'',location.pathname);
}
</script>
